name: Refund Desk CI
on:
  pull_request:
  push:
    # PR workflows check GitHub's synthetic merge commit. Also run on the
    # submitted branch head: the platform verifies this exact SHA after merge.
    branches: [main, 'ticket/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
